name: Build Bruce Remote APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o BruceRemoteApp.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        working-directory: BruceRemoteApp
        run: npm install

      - name: Sync Capacitor
        working-directory: BruceRemoteApp
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: BruceRemoteApp/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: BruceRemoteApp/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bruce-remote-debug-apk
          path: BruceRemoteApp/android/app/build/outputs/apk/debug/app-debug.apk
